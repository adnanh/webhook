# Include in the Nginx http context; use with hub-integrated.yaml and
# agent-integrated.yaml. Replace domain and certificate paths before use.
# /wh1 is an example deployment prefix. Replace it throughout this file and
# update the Agent server URL and the Hub admin-path (if Admin is enabled).
map $http_upgrade $webhook_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name hub.example.com;
    ssl_certificate /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $webhook_connection_upgrade;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    location = /wh1 {
        return 308 /wh1/;
    }

    # 1. Agent control/data WebSockets: strip only the deployment prefix.
    location /wh1/__webhook_network/ {
        proxy_pass http://127.0.0.1:9000/__webhook_network/;
    }

    # 2. Public business hooks: match the prefix used by hub.hook_routes.
    location /wh1/ingress/ {
        proxy_pass http://127.0.0.1:9000/ingress/;
    }

    # 3. Management UI/API/assets: preserve the complete URI.
    # Requires admin-path: wh1/admin if Admin is enabled on the Hub.
    location = /wh1/admin {
        proxy_pass http://127.0.0.1:9000;
    }
    location /wh1/admin/ {
        proxy_pass http://127.0.0.1:9000;
    }

    # 4. Service status and the existing root probe.
    location = /wh1/status {
        proxy_pass http://127.0.0.1:9000/status;
    }
    location = /wh1/ {
        proxy_pass http://127.0.0.1:9000/;
    }

    # Local /hooks/{id} and unlisted paths are not exposed by this example.
    location / {
        return 404;
    }
}
