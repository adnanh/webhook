ip: 127.0.0.1
port: 19000
verbose: true
# Used if Admin is enabled with the nginx-subpath.conf demo.
admin-path: wh1/admin
network:
  mode: hub
  hub:
    request_timeout: 10s
    nodes:
      - id: demo
        token_env: DEMO_NODE_TOKEN
        services: [webhook]
    hook_routes:
      - path: /demo/hello
        hook: hello
        agents: [demo]
