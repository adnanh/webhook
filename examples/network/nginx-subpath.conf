# Standalone loopback demo. Run from the repository root; see examples/README.md.
# /wh1 is an example deployment prefix. Replace it throughout this file and
# update the Agent server URL and the Hub admin-path (if Admin is enabled).
worker_processes 1;
pid nginx.pid;
error_log stderr;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path client_body_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    map $http_upgrade $webhook_connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 127.0.0.1:19001;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $webhook_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        location = /wh1 {
            return 308 /wh1/;
        }

        # 1. Agent control/data WebSockets: strip only the deployment prefix.
        location /wh1/__webhook_network/ {
            proxy_pass http://127.0.0.1:19000/__webhook_network/;
        }

        # 2. Public business hooks: match the prefix used by hub.hook_routes.
        location /wh1/demo/ {
            proxy_pass http://127.0.0.1:19000/demo/;
        }

        # 3. Management UI/API/assets: preserve the complete URI.
        # Requires admin-path: wh1/admin if Admin is enabled on the Hub.
        location = /wh1/admin {
            proxy_pass http://127.0.0.1:19000;
        }
        location /wh1/admin/ {
            proxy_pass http://127.0.0.1:19000;
        }

        # 4. Service status and the existing root probe.
        location = /wh1/status {
            proxy_pass http://127.0.0.1:19000/status;
        }
        location = /wh1/ {
            proxy_pass http://127.0.0.1:19000/;
        }

        # Local /hooks/{id} and unlisted paths are not exposed by this example.
        location / {
            return 404;
        }
    }
}
